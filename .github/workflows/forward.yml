name: Telegram to DingTalk

on:
  # 主触发源：cron-job.org 每 15 分钟调用 workflow_dispatch
  workflow_dispatch:
  # 兜底触发源：GitHub 自带 cron（低频、避开整点，防 cron-job.org 失效导致完全断链）
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor group and forward
        env:
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          KEYWORD: ${{ secrets.KEYWORD }}
        run: python forward.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "update state" && git push)
